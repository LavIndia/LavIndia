<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LavIndia">
  <title>LavIndia</title>

  <!--
    A four-point star set inside a hexagon.

    Drawn for a favicon first. At 16px almost nothing survives but the
    silhouette, so: few shapes, a star with a thick waist rather than fine
    points, no white core to punch a hole through the middle, and a rim held
    far enough off the star that the two never merge into a blob. The palette
    is the brand's own onyx and gold tokens, not new colours.
  -->

  <defs>
    <!-- Antique-to-bright gold running corner to corner, so the star reads as
         metal catching light rather than a flat fill. -->
    <linearGradient id="lavGold" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0d98c"/>
      <stop offset="0.5" stop-color="#dcc064"/>
      <stop offset="1" stop-color="#b8933a"/>
    </linearGradient>
  </defs>

  <!-- Onyx ground: a pointed-top hexagon, inset so its corners are not clipped
       when a browser rounds the icon. -->
  <path d="M32 2 57 16.75 57 47.25 32 62 7 47.25 7 16.75Z" fill="#1f1d1b"/>

  <!-- Hairline gold rim. Kept close to the edge and light in weight so at
       small sizes it becomes a soft glow rather than a competing shape. -->
  <path d="M32 6.8 52.8 19.1 52.8 44.9 32 57.2 11.2 44.9 11.2 19.1Z"
        fill="none" stroke="url(#lavGold)" stroke-width="1.5" stroke-linejoin="round" opacity="0.55"/>

  <!-- The star. Its waist is deliberately thick: a more elegant, needle-pointed
       star disappears entirely in a browser tab. Slightly taller than wide, to
       sit comfortably in a hexagon that is itself taller than wide. -->
  <path d="M32 13
           C33.9 26.1 36.9 29.1 49 31
           C36.9 32.9 33.9 35.9 32 49
           C30.1 35.9 27.1 32.9 15 31
           C27.1 29.1 30.1 26.1 32 13Z"
        fill="url(#lavGold)"/>
</svg>
