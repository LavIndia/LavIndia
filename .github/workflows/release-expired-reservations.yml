# Sweeps stock holds that have outlived their window.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan
# limits cron jobs to **once per day**, and a more frequent expression fails
# the whole deployment:
#
#   "Hobby accounts are limited to daily cron jobs. This cron expression
#    (*/10 * * * *) would run more than once per day."
#
# Once a day is no use for this job. An abandoned checkout holds stock, and
# with single-piece runs the last item would sit unsellable for up to 24
# hours with no screen explaining why. GitHub Actions schedules the same
# endpoint for free at the cadence the job actually needs.
#
# On upgrading to Vercel Pro, delete this workflow and put the cron back in
# vercel.json — Vercel's scheduler is more punctual than this one:
#
#   { "crons": [ { "path": "/api/cron/release-expired-reservations",
#                  "schedule": "*/10 * * * *" } ] }
#
# Required once, in GitHub → Settings → Secrets and variables → Actions:
#   secret  CRON_SECRET     must match the value set in Vercel's env vars
#   var     PRODUCTION_URL  optional; defaults to the Vercel domain below

name: Release expired reservations

on:
  schedule:
    # Every 10 minutes. GitHub runs these on a best-effort basis and can be
    # several minutes late under load, which this job tolerates — it only
    # releases holds that have already expired.
    - cron: "*/10 * * * *"
  # So the job can be run by hand from the Actions tab when testing.
  workflow_dispatch:

# A slow run must never pile up behind the next tick.
concurrency:
  group: release-expired-reservations
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sweeper
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://lav-india.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Deliberately not `set -e`: curl's own exit status is uninteresting
          # next to the HTTP status, and aborting on it would skip the branch
          # below that says what actually went wrong.
          set -uo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set in this repository. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          body=$(mktemp)
          status=$(curl --silent --show-error \
            --max-time 60 --retry 2 --retry-delay 5 \
            --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/release-expired-reservations") || status="000"

          echo "GET ${BASE_URL}/api/cron/release-expired-reservations -> HTTP ${status}"
          cat "$body"; echo

          # Each status the endpoint can return means one specific thing, so
          # each gets the message that names the fix rather than a bare code.
          case "$status" in
            200)
              echo "Sweep completed."
              ;;
            503)
              echo "::error::The endpoint reports CRON_SECRET is not configured on the server. Set CRON_SECRET in Vercel -> Settings -> Environment Variables (Production), then redeploy."
              exit 1
              ;;
            401)
              echo "::error::The endpoint rejected the secret. The value in this repository's Actions secrets does not match the one in Vercel's environment variables."
              exit 1
              ;;
            000)
              echo "::error::Could not reach ${BASE_URL}. Check the PRODUCTION_URL variable and that the deployment is live."
              exit 1
              ;;
            *)
              echo "::error::Sweeper returned HTTP ${status}."
              exit 1
              ;;
          esac
